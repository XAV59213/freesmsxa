send_sms:
  name: Send SMS
  description: Send an SMS via a configured notify entity or legacy notify service.
  fields:
    target:
      name: Target
      description: Notify entity or service (papa or notify.papa).
      required: true
      example: notify.papa
      selector:
        text:
    message:
      name: Message
      description: Text message to send.
      required: true
      example: Piscine hors gel !
      selector:
        text:
          multiline: true
